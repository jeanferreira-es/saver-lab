plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.jean.igsaver'
version = '1.0.0'

android {
  namespace "expo.modules.floatingbubble"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
  // OverlayActivity é uma tela React Native (ReactActivity, tema AppCompat).
  implementation 'com.facebook.react:react-android'
  implementation "androidx.appcompat:appcompat:1.7.0"
}
